name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: home-lang/pantry/packages/action@v0.9.18

      - name: Install Dependencies
        run: bun install

      - name: Publish
        run: pantry publish --npm --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Standalone binaries for the platforms the release advertises. Cross
      # compilation downloads a runtime matching the compiler's version, so
      # this needs a released Bun — which is what the pantry setup step above
      # provides.
      - name: Build release binaries
        run: bun run build:binaries

      # Pantry attaches the binaries and extracts this tag's section from
      # CHANGELOG.md for the body. The previous action-releaser step passed no
      # notes input at all, so every release back to v0.9.20 published empty,
      # and its globs pointed at binaries nothing built.
      - name: Create GitHub Release
        uses: home-lang/pantry/packages/action@v0.9.18
        with:
          release: true
          release-changelog: CHANGELOG.md
          release-checksums: 'true'
          release-files: |
            ./bin/buddy-bot-linux-x64.zip
            ./bin/buddy-bot-linux-arm64.zip
            ./bin/buddy-bot-windows-x64.zip
            ./bin/buddy-bot-darwin-x64.zip
            ./bin/buddy-bot-darwin-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
