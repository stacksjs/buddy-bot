name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: home-lang/pantry/packages/action@v0.9.18

      - name: Install Dependencies
        run: bun install

      - name: Publish
        run: pantry publish --npm --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Pantry extracts this tag's section from CHANGELOG.md and posts it as the
      # release body. The previous action-releaser step passed no notes input at
      # all, so every release back to v0.9.20 published with an empty body — and
      # its `files:` globs pointed at binaries this workflow never builds, so it
      # attached nothing either.
      - name: Create GitHub Release
        uses: home-lang/pantry/packages/action@v0.9.18
        with:
          release: true
          release-changelog: CHANGELOG.md
          release-files: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
